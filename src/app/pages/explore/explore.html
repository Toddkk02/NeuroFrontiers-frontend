<div class="explore-container">
  <div class="header">
    <h2>Explore Experiences</h2>
    <p>Browse shared experiences from the community</p>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    <p>Loading...</p>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
  </div>

  <!-- Posts Grid -->
  <div *ngIf="!loading && !error" class="experiences-grid">
    <div *ngFor="let post of posts" class="experience-card">
      <div class="card-header">
        <span class="category psychedelics">{{ post.category || 'Experience' }}</span>

      </div>

      <h3 class="card-title">{{ post.title }}</h3>

      <p class="card-preview">
        {{ post.body }}
      </p>


      <span class="post-author">By {{ post.author }}</span>

      <div class="card-footer">

        <button
          *ngIf="isAdmin()"
          (click)="deletePost(post.id)"
          class="delete-btn">
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
