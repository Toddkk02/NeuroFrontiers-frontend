<div class="register-container">
  <h2>Register</h2>
  
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Username</label>
      <input [(ngModel)]="username" name="username" type="text" required>
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" name="password" type="password" required>
    </div>
    
    <div class="form-group">
      <label>Confirm Password</label>
      <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" required>
    </div>
    
    <div class="form-group">
      <label>Birthdate (optional)</label>
      <input [(ngModel)]="birthdate" name="birthdate" type="date">
    </div>
    
    <p *ngIf="error" class="error">{{ error }}</p>
    <p *ngIf="success" class="success">{{ success }}</p>
    
    <button type="submit">Register</button>
    
    <p class="login-link">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </form>
</div>
