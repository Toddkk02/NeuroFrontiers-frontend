<mat-drawer-container class="sidenav-container">
  <mat-drawer #drawer mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <h2>Navigation</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/home">
        <mat-icon>home</mat-icon>
        <span class="mat-line">Home</span>
      </a>
      <a mat-list-item routerLink="/explore">
        <mat-icon>explore</mat-icon>
        <span class="mat-line">Explore</span>
      </a>
      <a mat-list-item routerLink="/substances">
        <mat-icon>science</mat-icon>
        <span class="mat-line">Substances</span>
      </a>
      <a mat-list-item routerLink="/submit">
        <mat-icon>add_circle</mat-icon>
        <span class="mat-line">Submit Experience</span>
      </a>
      <a mat-list-item routerLink="/harm-reduction">
        <mat-icon>health_and_safety</mat-icon>
        <span class="mat-line">Harm Reduction</span>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-drawer-content class="main-content">
    <div class="toolbar">
      <button mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <h1>{{ title }}</h1>

      <div class="spacer"></div>

      <!-- LOGIN/REGISTER BUTTONS (non loggato) -->
      <div class="auth-buttons" *ngIf="!isLoggedIn()">
        <button mat-button routerLink="/login">Login</button>
        <button mat-raised-button color="primary" routerLink="/register">Register</button>
      </div>

      <!-- USER MENU (loggato) -->
      <div class="user-info" *ngIf="isLoggedIn()">
        <span class="username-display">{{ getUsername() }}</span>

        <!-- ✅ MENU DROPDOWN -->
        <button mat-icon-button [matMenuTriggerFor]="userMenu">
          <mat-icon>account_circle</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="goToProfile()">
            <mat-icon>person</mat-icon>
            <span>Profile</span>
          </button>

          <button mat-menu-item (click)="goToSettings()">
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
          </button>

          <!-- Admin Panel (solo per admin) -->
          <button mat-menu-item *ngIf="isAdmin()" routerLink="/admin">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Admin Panel</span>
          </button>

          <mat-divider></mat-divider>

          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>
    </div>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </mat-drawer-content>
</mat-drawer-container>
